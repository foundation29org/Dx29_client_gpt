<!-- Hero Section -->
<section class="hero-section">
  <div class="container">
    <div class="hero-content">
      <h1 class="hero-title">{{'land.faqs.title' | translate }}</h1>
      <p class="hero-description">{{'land.faqs.subtitle' | translate }}</p>
    </div>
  </div>
</section>

<!-- Main Content -->
<section class="main-content">
  <div class="container">
    
    <!-- FAQs Section -->
    <div class="content-section">
      <div class="faqs-container">
        
        <div class="faq-item" *ngFor="let faq of faqNumbers">
          <h2 class="faq-heading">
            <button type="button"
                    class="faq-question"
                    [id]="'faq-question-' + faq"
                    [attr.aria-expanded]="!!expandedFaqs[faq]"
                    [attr.aria-controls]="'faq-answer-' + faq"
                    (click)="toggleFaq(faq)">
              <span class="faq-title">{{'land.faqs.q' + faq | translate }}</span>
              <i class="fas fa-chevron-down faq-icon" [class.rotated]="expandedFaqs[faq]" aria-hidden="true"></i>
            </button>
          </h2>
          <div class="faq-answer"
               [id]="'faq-answer-' + faq"
               [class.expanded]="expandedFaqs[faq]">
            <p>{{'land.faqs.a' + faq | translate }}</p>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
