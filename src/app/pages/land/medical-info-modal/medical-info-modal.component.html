<div class="modal-header">
  <h2
    id="medical-answer-title"
    class="modal-title"
    [class.modal-title--interactive]="isLongTitle"
    [class.modal-title--expanded]="titleExpanded"
    [attr.role]="isLongTitle ? 'button' : null"
    [attr.tabindex]="isLongTitle ? 0 : null"
    [attr.aria-expanded]="isLongTitle ? titleExpanded : null"
    [title]="title"
    (click)="toggleTitle()"
    (keydown.enter)="toggleTitle()"
    (keydown.space)="onTitleSpace($event)">
    <i class="fas fa-info-circle text-white modal-title__icon" aria-hidden="true"></i>
    <span class="modal-title__text">{{ title }}</span>
    <i
      *ngIf="isLongTitle"
      class="fas modal-title__chevron"
      [class.fa-chevron-down]="!titleExpanded"
      [class.fa-chevron-up]="titleExpanded"
      aria-hidden="true">
    </i>
  </h2>
  <button
    type="button"
    class="btn-close"
    [attr.aria-label]="closeButtonText"
    [title]="closeButtonText"
    (click)="activeModal.dismiss()">
  </button>
</div>
<div class="modal-body">
  <app-medical-answer-view [answer]="answer"></app-medical-answer-view>
</div>
<div class="modal-footer">
  <ng-container *ngIf="showQuestionActions; else closeAction">
    <p class="modal-note">
      <i class="fa fa-shield me-1" aria-hidden="true"></i>
      {{ 'beta.independent_context' | translate }}
    </p>
    <button
      type="button"
      class="modal-action modal-action--secondary"
      (click)="activeModal.close('edit')">
      <i class="fa fa-pencil" aria-hidden="true"></i>
      {{ 'beta.edit_question' | translate }}
    </button>
    <button
      type="button"
      class="modal-action modal-action--primary"
      (click)="activeModal.close('new')">
      <i class="fa fa-plus" aria-hidden="true"></i>
      {{ 'beta.new_question' | translate }}
    </button>
  </ng-container>

  <ng-template #closeAction>
    <button type="button" class="btn btn-secondary" (click)="activeModal.close()">
      {{ closeButtonText }}
    </button>
  </ng-template>
</div>
